<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANGAVERSE - Baca Manga & Komik Terupdate</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="MANGAVERSE adalah platform baca manga, manhwa, dan manhua bahasa Indonesia dengan antarmuka gelap yang minimalis dan terupdate setiap hari.">
    <meta name="keywords" content="baca manga, manga bahasa indonesia, manhwa, manhua, mangaverse">
    <meta name="author" content="Sanka Vollerei">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="MANGAVERSE - Baca Manga Terupdate">
    <meta property="og:description" content="Baca ribuan chapter komik terbaru dengan UI/UX yang nyaman dan cepat.">
    <meta property="og:type" content="website">
    
    <!-- Tailwind CSS (CDN for quick setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0f172a',
                        darker: '#020617',
                        primary: '#38bdf8',
                        surface: '#1e293b'
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Hide scrollbar for horizontal scroll areas but keep functionality */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-darker text-gray-200 min-h-screen flex flex-col antialiased">

    <!-- Navigation -->
    <header class="sticky top-0 z-50 bg-darker/80 backdrop-blur-md border-b border-surface">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center gap-2 cursor-pointer" onclick="window.location.hash='#home'">
                    <svg class="w-8 h-8 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                    <span class="font-bold text-xl tracking-wider text-white">MANGAVERSE</span>
                </div>
                
                <!-- Desktop Menu -->
                <nav class="hidden md:flex space-x-8" aria-label="Main Navigation">
                    <a href="#home" class="nav-link text-primary font-medium hover:text-primary transition-colors" data-path="home">Home</a>
                    <a href="#favorite" class="nav-link text-gray-400 hover:text-primary transition-colors" data-path="favorite">Favorite</a>
                    <a href="#genres" class="nav-link text-gray-400 hover:text-primary transition-colors" data-path="genres">Genres</a>
                    <a href="#developer" class="nav-link text-gray-400 hover:text-primary transition-colors" data-path="developer">Developer</a>
                </nav>

                <!-- Mobile Menu Button -->
                <div class="md:hidden flex items-center">
                    <button id="mobile-menu-btn" class="text-gray-400 hover:text-white focus:outline-none" aria-label="Open Menu">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area (Dynamic) -->
    <main id="app-root" class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        <!-- Content will be injected here by JS -->
    </main>

    <!-- Footer -->
    <footer class="bg-dark border-t border-surface mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center text-sm text-gray-500">
            &copy; 2026 MANGA<span class="text-primary">VERSE</span>. Developed with focus on minimal UI & performance.
        </div>
    </footer>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
