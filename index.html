<!-- index.html -->
<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANGAVERSE - Baca Manga & Komik Terupdate</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="MANGAVERSE adalah platform baca manga, manhwa, dan manhua bahasa Indonesia dengan antarmuka gelap minimalis yang super cepat.">
    <meta name="keywords" content="baca manga, manga bahasa indonesia, manhwa, manhua, mangaverse">
    <meta name="author" content="Sanka Vollerei">
    
    <!-- Open Graph -->
    <meta property="og:title" content="MANGAVERSE - Baca Manga Terupdate">
    <meta property="og:description" content="Baca ribuan chapter komik terbaru dengan UI/UX yang nyaman dan tanpa iklan mengganggu.">
    <meta property="og:type" content="website">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: '#0f0f15',
                        darker: '#050508',
                        primary: '#f97316', /* Orange-Red/Coral Accent */
                        secondary: '#ef4444',
                        surface: '#181823',
                        borderBlur: 'rgba(30, 30, 45, 0.5)'
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-darker text-gray-200 min-h-screen flex flex-col antialiased pb-20 sm:pb-24">

    <!-- Top Header Title Bar -->
    <header class="sticky top-0 z-40 bg-darker/90 backdrop-blur-md border-b border-surface px-4 py-4">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.hash='#home'">
                <svg class="w-6 h-6 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
                <span class="font-bold text-lg tracking-wider text-white">MANGA<span class="text-primary">VERSE</span></span>
            </div>
            <div id="top-nav-context" class="text-xs text-gray-400 font-medium truncate max-w-[200px]"></div>
        </div>
    </header>

    <!-- Dynamic Content Root -->
    <main id="app-root" class="flex-grow max-w-4xl mx-auto w-full px-4 py-6">
        <!-- Content injected dynamically -->
    </main>

    <!-- Fix Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-50 bg-dark/95 backdrop-blur-lg border-t border-surface shadow-2xl safe-bottom" aria-label="Mobile Navigation">
        <div class="max-w-md mx-auto flex justify-around items-center h-16 px-2">
            
            <a href="#home" class="nav-btn flex flex-col items-center justify-center flex-grow text-primary transition-colors py-1" data-path="home">
                <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                <span class="text-[10px] font-medium tracking-wide">Home</span>
            </a>
            
            <a href="#favorite" class="nav-btn flex flex-col items-center justify-center flex-grow text-gray-400 hover:text-primary transition-colors py-1" data-path="favorite">
                <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
                <span class="text-[10px] font-medium tracking-wide">Favorite</span>
            </a>
            
            <a href="#genres" class="nav-btn flex flex-col items-center justify-center flex-grow text-gray-400 hover:text-primary transition-colors py-1" data-path="genres">
                <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
                <span class="text-[10px] font-medium tracking-wide">Genres</span>
            </a>
            
            <a href="#developer" class="nav-btn flex flex-col items-center justify-center flex-grow text-gray-400 hover:text-primary transition-colors py-1" data-path="developer">
                <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                <span class="text-[10px] font-medium tracking-wide">Dev</span>
            </a>
            
        </div>
    </nav>

    <!-- App Logic Injection -->
    <script src="app.js"></script>
</body>
</html>
